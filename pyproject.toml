[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-lab"
version = "0.1.0"
description = "A local reliability and recovery lab backed by SQLite"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.2", "bandit==1.8.6", "pip-audit==2.9.0"]

[project.scripts]
reliability-lab = "reliability_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.bandit]
exclude_dirs = ["tests"]
