version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
