name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reliability-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Update the bundled pip installer
        run: python -m pip install --upgrade pip
      - name: Install pinned project validators
        run: python -m pip install --disable-pip-version-check '.[dev]'
      - name: Lint
        run: ruff check src
      - name: Security scan
        run: bandit --quiet --recursive src
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Compile source
        run: python -m compileall -q src

  prometheus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Prometheus config and alert rules
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/prometheus:/work:ro"
          --workdir /work
          --entrypoint /bin/promtool
          prom/prometheus:v3.15.0
          check config prometheus.yml
      - name: Check rule syntax
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/prometheus:/work:ro"
          --workdir /work
          --entrypoint /bin/promtool
          prom/prometheus:v3.15.0
          check rules rules.yml
