apiVersion: v1
kind: ServiceAccount
metadata:
  name: reliability-prometheus
  namespace: reliability-lab
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reliability-prometheus-discovery
  namespace: reliability-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reliability-prometheus-discovery
  namespace: reliability-lab
subjects:
  - kind: ServiceAccount
    name: reliability-prometheus
    namespace: reliability-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reliability-prometheus-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-prometheus
  namespace: reliability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: reliability-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reliability-prometheus
    spec:
      serviceAccountName: reliability-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: configuration
              mountPath: /etc/prometheus
              readOnly: true
            - name: database
              mountPath: /prometheus
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: reliability-prometheus-config
        - name: database
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reliability-prometheus
  namespace: reliability-lab
spec:
  selector:
    app.kubernetes.io/name: reliability-prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
